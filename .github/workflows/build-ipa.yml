name: Build unsigned IPA (arm64 + arm64_32)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID do app do iPhone (o do Watch vira <id>.watchkitapp)"
        required: false
        default: "com.example.Clocky"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar o Xcode mais novo disponível
        run: |
          ls -d /Applications/Xcode*.app
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Usando $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || true

      - name: Converter projeto para o formato do Xcode 26
        run: |
          cat > /tmp/downgrade.py <<'PYEOF'
          import re,sys
          p=sys.argv[1]; s=open(p).read()
          s=s.replace('objectVersion = 110;','objectVersion = 77;').replace('preferredProjectObjectVersion = 110;','preferredProjectObjectVersion = 77;')
          s=re.sub(r'(\n(\t+))dstSubfolder = Product;', r'\1dstSubfolderSpec = 16;', s)
          def fix(m):
              block=m.group(0)
              ind=re.search(r'\n(\t+)isa = ',block).group(1)
              if 'buildActionMask' not in block:
                  block=block.replace(f'\n{ind}isa = {m.group(1)};', f'\n{ind}isa = {m.group(1)};\n{ind}buildActionMask = 2147483647;',1)
              if 'runOnlyForDeploymentPostprocessing' not in block:
                  block=re.sub(r'\n(\t+)\};$', lambda mm: f'\n{ind}runOnlyForDeploymentPostprocessing = 0;\n{mm.group(1)}}};', block, count=1)
              return block
          s=re.sub(r'\n\t\t[0-9A-F]{24} /\* [^*]+ \*/ = \{\n\t\t\tisa = (PBX(?:Frameworks|Resources|Sources|CopyFiles|ShellScript)BuildPhase);.*?\n\t\t\};', fix, s, flags=re.S)
          open(p,'w').write(s)
          print('objectVersion ok' if 'objectVersion = 77;' in s else 'FALHOU')
          PYEOF
          python3 /tmp/downgrade.py Clocky.xcodeproj/project.pbxproj

      - name: Arquiteturas do Watch = arm64 + arm64_32 (Xcode 26 não conhece arm64e.x1)
        run: |
          # Substitui qualquer lista ARCHS[sdk=watchos*] por arm64 + arm64_32.
          # arm64 cobre Series 9+ / Ultra 2+; arm64_32 cobre Series 4–8 e SE.
          perl -0pi -e 's/"ARCHS\[sdk=watchos\*\]" = \([^)]*\);/"ARCHS[sdk=watchos*]" = (\n\t\t\t\t\tarm64,\n\t\t\t\t\tarm64_32,\n\t\t\t\t);/g' Clocky.xcodeproj/project.pbxproj
          grep -A4 'ARCHS\[sdk=watchos' Clocky.xcodeproj/project.pbxproj
          ! grep -q 'arm64e' Clocky.xcodeproj/project.pbxproj

      - name: Remover arquitetura arm64e.x1 dos .tbd (Xcode 26 não conhece)
        run: |
          find . -name "*.tbd" -exec perl -pi -e 's/,\s*arm64e\.x1-watchos//g; s/arm64e\.x1-watchos,\s*//g' {} +
          ! grep -rl "arm64e.x1" --include=*.tbd .
          
      - name: Gerar IPA sem assinatura
        run: |
          BID="${{ github.event.inputs.bundle_id }}"
          [ -n "$BID" ] || BID="com.example.Clocky"
          bash scripts/create_ipa.sh --bundle-id "$BID" --output build/ipa/Clocky.ipa

      - name: Conferir arquiteturas do binário do Watch
        run: |
          cd build/ipa && rm -rf x && mkdir x && cd x && unzip -q ../Clocky.ipa
          W="$(ls -d Payload/*.app/Watch/*.app)"
          lipo -info "$W/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$W/Info.plist")"

      - uses: actions/upload-artifact@v4
        with:
          name: Clocky-ipa
          path: build/ipa/Clocky.ipa
          if-no-files-found: error
